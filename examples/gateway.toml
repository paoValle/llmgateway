# Example configuration. Copy it and adapt it.
#
# A note on what is here and what is not: **no secrets in this file.** Keys are taken
# from the environment, and below there is only the name of the variable to read them
# from. This file is therefore committable, and a diff on it cannot leak a key.

[server]
bind = "127.0.0.1:8080"
request_timeout_ms = 60_000
# Attempt cap across all providers together. Failover without a cap is a
# self-feeding attack.
max_attempts = 4
# 1 = exact metrics. Above 1, one request in N is counted.
metrics_sample_rate = 100

# --- providers, in order of preference ---
# The priority must be unique: two providers with the same priority make failover
# non-deterministic, and the configuration is rejected.

[[providers]]
name = "primary"
base_url = "https://api.openai.com/v1"
api_key_env = "PRIMARY_API_KEY"
priority = 1

[[providers]]
name = "secondary"
base_url = "https://api-fallback.example.com/v1"
api_key_env = "SECONDARY_API_KEY"
priority = 2

# --- prices: dollars per million tokens ---
# A model that is not listed is valued at the highest price known, never at zero:
# a zero price means "the cap protects" while it protects nothing.

[pricing]
"gpt-4o-mini" = { input = 0.15, output = 0.60 }
"gpt-4o"      = { input = 2.50, output = 10.00 }

# --- tenants ---
# `models` is optional. If you set it, the tenant cannot use any others: it is a
# constraint that weighs as much as the cap, and it must be thought through.

[[tenants]]
id = "acme"
key_env = "TENANT_ACME_KEY"
monthly_budget_usd = 50.0
models = ["gpt-4o-mini", "gpt-4o"]

[[tenants]]
id = "beta"
key_env = "TENANT_BETA_KEY"
monthly_budget_usd = 5.0
