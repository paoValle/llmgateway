name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the toolchain is declared by rust-toolchain.toml: the channel is not duplicated here
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the same code on two systems: Linux is where it runs in production,
        # macOS is where a test that depends on the locale slips through
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  # the lockfile is what makes the build reproducible: the lock is complete and
  # consistent with the manifests, and `--locked` proves it by refusing to write.
  # What is deliberately *not* asserted: that the registry has published nothing
  # newer. That was `cargo update --locked`, and it went red every time a dependency
  # published a compatible version while the build and the tests were unaffected --
  # a chore, not a signal. "Something published" is what .github/dependabot.yml is for.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo metadata --locked --format-version 1 > /dev/null
