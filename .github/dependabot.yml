version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Same: minors are merged if CI is green, majors are a decision.
    # In Rust that is even more true: a major change often touches `unsafe` and
    # features, and an automatic PR that does it on its own is a PR nobody looks at.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
