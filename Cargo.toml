[package]
name = "llmgateway"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "LLM gateway: per-token metering, per-tenant budget, failover between providers, Prometheus metrics."
license = "MIT"
readme = "README.md"
repository = "https://github.com/paoValle/llmgateway"
keywords = ["llm", "gateway", "proxy", "metering", "budget"]
categories = ["network-programming", "api-bindings"]

# see docs/adr/0001-dependencies.md: a minimal, declared set, nothing else.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures-util = "0.3"
sha2 = "0.10"

[dev-dependencies]
# `tokio` as a dev-dependency with the test features: the router tests are
# asynchronous, and without the macro you cannot write `#[tokio::test]`
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The fake provider used by `tests/support`: the script, the counters and the JSON bodies
# are shared with the projects that measure this gateway, so a behaviour added for one of
# them is not invisible in the others. `tests/support` keeps only the adapter onto
# `Upstream`, which is this crate's own vocabulary.
test-provider = { git = "https://github.com/paoValle/test-provider" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# these are not defects in a gateway: they are noise in a domain where
# `unwrap` is trivial but `expect` with a message is documentation
# (left disabled by choice: see docs/adr/0001-dependencies.md)
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
